builders:
  # Phase 1: Collect all @PgTable definitions into JSON files
  tableCollector:
    import: "package:aim_orm_codegen/aim_orm_codegen.dart"
    builder_factories: [ "tableCollectorBuilder" ]
    build_extensions: { ".dart": [ ".aim_tables.json" ] }
    build_to: cache
    auto_apply: all_packages

  # Phase 2: Generate ORM code using collected table info
  recordPgTable:
    import: "package:aim_orm_codegen/aim_orm_codegen.dart"
    builder_factories: [ "recordPgTableBuilder" ]
    build_extensions: { ".dart": [ ".aim_record_table.g.part" ] }
    build_to: cache
    auto_apply: all_packages
    required_inputs: [ ".aim_tables.json" ]
    applies_builders: [ "source_gen|combining_builder" ]

targets:
  $default:
    builders:
      aim_orm_codegen|tableCollector:
        generate_for:
          - lib/**
          - test/**
      aim_orm_codegen|recordPgTable:
        generate_for:
          - lib/**
          - test/**
      source_gen|combining_builder:
        generate_for:
          - lib/**
          - test/**
