version: 2
updates:
  # VitePress docs site
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs-npm:
        patterns: ["*"]

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Dart packages (pub workspace members)
  - package-ecosystem: pub
    directories:
      - /packages/*
      - /examples/*
      - /tools/release
    schedule:
      interval: weekly
    groups:
      dart-deps:
        patterns: ["*"]
